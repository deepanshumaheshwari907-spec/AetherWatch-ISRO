services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./vendor:/app/vendor:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=10).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  dashboard:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m core.mosdac_worker
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./vendor:/app/vendor:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2.8-alpine
    environment:
      AETHERWATCH_DOMAIN: ${AETHERWATCH_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
